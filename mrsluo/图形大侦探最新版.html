<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜猜它是什么 - 平面图形认知游戏</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Marker Felt', cursive;
            background-color: #f0f9ff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        h1 {
            color: #ff6b6b;
            font-size: 3rem;
            text-shadow: 3px 3px 0 #ffd166;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 90%;
            max-width: 800px;
            margin-bottom: 20px;
            background: #a0d2eb;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .timer, .score {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            background: #ff6b6b;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }
        
        .game-area {
            position: relative;
            width: 90%;
            max-width: 800px;
            height: 500px;
            background: #e5f7ff;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            overflow: hidden;
        }
        
        canvas {
            display: block;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 800px;
        }
        
        .action-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .shape-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            width: 150%;
        }
        
        button {
            border: none;
            border-radius: 50px;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .action-btn {
            background: #ffd166;
            color: #d1495b;
        }
        
        .shape-btn {
            min-width: 180px;
            background: #a0d2eb;
            color: #2d3142;
        }
        
        .shape-btn.correct {
            background: #a7d489;
            animation: pulse 0.5s;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .message {
            position: absolute;
            top: 75%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: bold;
            color: #ff6b6b;
            text-shadow: 3px 3px 0 #ffd166;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .instructions {
            margin-top: 25px;
            font-size: 1.4rem;
            color: #5a5a5a;
            text-align: center;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .message.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <h1>图形小侦探</h1>
    
    <div class="game-info">
       <!-- <div class="timer">时间: <span id="time">00:00</span></div>-->
        <div class="score">积分: <span id="score">0</span></div>
    </div>
    
    <div class="game-area">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="message" class="message">太棒了！</div>
    </div>
    
    <div class="controls">
        <div class="action-buttons">
            <button id="changeBtn" class="action-btn">换一换</button>
            <button id="restartBtn" class="action-btn">再玩一次</button>
        </div>
        
        <div class="shape-buttons">
            <button data-shape="rectangle" class="shape-btn">长方形</button>
            <button data-shape="square" class="shape-btn">正方形</button>
            <button data-shape="parallelogram" class="shape-btn">平行四边形</button>
            <button data-shape="triangle" class="shape-btn">三角形</button>
            <button data-shape="circle" class="shape-btn">圆</button>
        </div>
    </div>

<div class="instructions">

    </div>

        // 初始化游戏
        function initGame() {
            // 重置游戏状态
            score = 0;
            startTime = Date.now();
            revealed = false;
            
            // 更新显示
            scoreDisplay.textContent = score;
            updateTimer();
            
            // 清除现有计时器
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            
            // 开始新计时器
            timerInterval = setInterval(updateTimer, 1000);
            
            // 生成新图形
            generateNewShape();
            
            // 重置按钮状态
            shapeButtons.forEach(btn => {
                btn.classList.remove('correct');
                btn.disabled = false;
            });
            
            // 隐藏消息
            message.classList.remove('show');
        }
        
        // 更新计时器
        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            // timeDisplay.textContent = `${minutes}:${seconds}`;
        }
        
        // 生成随机图形
        function generateNewShape() {
            // 图形类型数组
            const shapes = ['rectangle', 'square', 'parallelogram', 'triangle', 'circle'];
            
            // 随机选择图形类型
            const shapeType = shapes[Math.floor(Math.random() * shapes.length)];
            
            // 设置图形属性
            currentShape = {
                type: shapeType,
                x: canvas.width / 2,
                y: canvas.height / 2 + 20,
                size: 80 + Math.random() * 70, // 随机大小
                rotation: Math.random() * Math.PI * 2, // 随机旋转角度
                color: getRandomColor()
            };
            
 // 如果是三角形，生成不规则三角形的点
            if (shapeType === 'triangle') {
                // 生成三个随机点（不规则三角形）
                const size = currentShape.size;
                const points = [];
                
                // 第一个点（随机位置）
                points.push({
                    x: -size/2 + Math.random() * size,
                    y: -size + Math.random() * size/2+50
                });
                
                // 第二个点（确保在合理范围内）
                points.push({
                    x: -size/2 + Math.random() * size-15,
                    y: size - Math.random() * size/2+70
                });
                
                // 第三个点（确保在合理范围内）
                points.push({
                    x: -size/2 + Math.random() * size+15,
                    y: size - Math.random() * size/2+90
                });
                
                // 存储三角形点
                currentShape.points = points;
            }
            

            // 绘制场景
            drawScene();
        }
        
        // 获取随机颜色
        function getRandomColor() {
            const colors = [
                '#FF6B6B', '#4ECDC4', '#FFD166', '#6A0572', '#1A936F',
                '#114B5F', '#456990', '#E76F51', '#2A9D8F', '#E9C46A'
            ];
            return colors[Math.floor(Math.random() * colors.length)];
        }
        
        // 绘制整个场景
        function drawScene() {
            // 清除画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景
            drawBackground();
            
            // 绘制信封底部
            drawEnvelopeBottom();
            
            // 绘制图形（部分被遮挡）
            drawShape();
            
            // 绘制信封顶部（遮挡部分图形）
            drawEnvelopeTop();
        }
        
        // 绘制背景
        function drawBackground() {
            // 渐变背景
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#e0f7fa');
            gradient.addColorStop(1, '#bbdefb');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 装饰性图案
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for (let i = 0; i < 20; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = 5 + Math.random() * 15;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 绘制信封底部
        function drawEnvelopeBottom() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 + 70;
            
            // 信封底部矩形
            ctx.fillStyle = '#FFD166';
            ctx.fillRect(centerX - 200, centerY - 50, 400, 200);
            
            // 信封底部三角形
            ctx.beginPath();
            ctx.moveTo(centerX - 200, centerY - 50);
            ctx.lineTo(centerX, centerY - 150);
            ctx.lineTo(centerX + 200, centerY - 50);
            ctx.closePath();
            ctx.fillStyle = '#FFB74D';
            ctx.fill();
            
            // 信封底部边框
            ctx.strokeStyle = '#FF9800';
            ctx.lineWidth = 4;
            ctx.strokeRect(centerX - 200, centerY - 50, 400, 200);
            ctx.beginPath();
            ctx.moveTo(centerX - 200, centerY - 50);
            ctx.lineTo(centerX, centerY - 150);
            ctx.lineTo(centerX + 200, centerY - 50);
            ctx.stroke();
        }
        
        // 绘制图形
        function drawShape() {
            if (!currentShape) return;
            
            ctx.save();
            ctx.translate(currentShape.x, currentShape.y);
            ctx.rotate(currentShape.rotation);
            
            ctx.fillStyle = currentShape.color;
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            
            switch (currentShape.type) {
                case 'rectangle':
                    // 长方形
                    const rectWidth = currentShape.size * 1.5;
                    const rectHeight = currentShape.size;
                    ctx.fillRect(-rectWidth/2, -rectHeight/2, rectWidth, rectHeight);
                    ctx.strokeRect(-rectWidth/2, -rectHeight/2, rectWidth, rectHeight);
                    break;
                    
                case 'square':
                    // 正方形
                    ctx.fillRect(-currentShape.size/2, -currentShape.size/2, currentShape.size, currentShape.size);
                    ctx.strokeRect(-currentShape.size/2, -currentShape.size/2, currentShape.size, currentShape.size);
                    break;
                    
                case 'parallelogram':
                    // 平行四边形
                    const paraWidth = currentShape.size * 1.5;
                    const paraHeight = currentShape.size;
                    const skew = 20;
                    
                    ctx.beginPath();
                    ctx.moveTo(-paraWidth/2 + skew, -paraHeight/2);
                    ctx.lineTo(paraWidth/2 + skew, -paraHeight/2);
                    ctx.lineTo(paraWidth/2 - skew, paraHeight/2);
                    ctx.lineTo(-paraWidth/2 - skew, paraHeight/2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    break;
                    
                case 'triangle':
                    // 三角形（不规则）
                    ctx.beginPath();
                    
                    if (currentShape.points) {
                        // 绘制不规则三角形
                        ctx.moveTo(currentShape.points[0].x, currentShape.points[0].y);
                        ctx.lineTo(currentShape.points[1].x, currentShape.points[1].y);
                        ctx.lineTo(currentShape.points[2].x, currentShape.points[2].y);
                    } else {
                        // 等腰三角形（备用）
                        ctx.moveTo(0, -currentShape.size/2);
                        ctx.lineTo(currentShape.size/2, currentShape.size/2);
                        ctx.lineTo(-currentShape.size/2, currentShape.size/2);
                    }
                    
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    break;
                    
                case 'circle':
                    // 圆形
                    ctx.beginPath();
                    ctx.arc(0, 0, currentShape.size/2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    break;
            }
            
            ctx.restore();
        }
        
        // 绘制信封顶部（遮挡部分图形）
        function drawEnvelopeTop() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 + 70;
            
            // 信封顶部矩形（只绘制部分）
            ctx.fillStyle = 'rgba(255, 241, 118, 1)';
            ctx.fillRect(centerX - 200, centerY - 50, 400, 200);
            
            // 信封顶部边框
            ctx.strokeStyle = '#FF9800';
            ctx.lineWidth = 4;
            ctx.strokeRect(centerX - 200, centerY - 50, 400, 200);
           }
        
        // 显示完整图形（当猜对时）
        function revealShape() {
            // 上移动画
            const startY = currentShape.y;
            const endY = canvas.height / 2 - 100;
            const duration = 1000;
            const startTime = Date.now();
            
            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 缓动函数
                const ease = 1 - Math.pow(1 - progress, 3);
                
                currentShape.y = startY + (endY - startY) * ease;
                drawScene();
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            
            animate();
        }
        
        // 播放庆祝音效
        function playCelebrationSound() {
            sound.src = celebrationSoundBase64;
            sound.play().catch(e => console.log("音频播放失败:", e));
        }
        
        // 检查答案
        function checkAnswer(selectedShape) {
            if (revealed) return;
            
            if (selectedShape === currentShape.type) {
                // 正确答案
                score++;
                scoreDisplay.textContent = score;
                
                // 播放音效
                playCelebrationSound();
                
                // 显示消息
                message.textContent = "太棒了！";
                message.classList.add('show');
                setTimeout(() => message.classList.remove('show'), 1500);
                
                // 标记正确的按钮
                shapeButtons.forEach(btn => {
                    if (btn.dataset.shape === selectedShape) {
                        btn.classList.add('correct');
                    }
                    btn.disabled = true;
                });
                
                // 显示完整图形
                revealed = true;
                revealShape();
            } else {
                // 错误答案
                message.textContent = "再试试看！";
                message.classList.add('show');
                sound.src = errorBase64;
                sound.play().catch(e => console.log("音频播放失败:", e));
                setTimeout(() => message.classList.remove('show'), 1000);
            }
        }
        
        // 事件监听
        changeBtn.addEventListener('click', () => {
            generateNewShape();
            shapeButtons.forEach(btn => {
                btn.classList.remove('correct');
                btn.disabled = false;
            });
            revealed = false;
        });
        
        restartBtn.addEventListener('click', initGame);
        
        shapeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                checkAnswer(btn.dataset.shape);
            });
        });
        
        // 初始化游戏
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
